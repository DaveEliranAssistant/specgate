name: SpecGate quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specgate-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --prefix packages/specgate --ignore-scripts
          npm ci --prefix poc/code-first-service-tests --ignore-scripts
      - name: Migration integrity, scanner and oracle tests
        run: npm test
      - name: Reproduce generated API and seeded-defect proofs
        run: npm run test:proofs
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Empty-cache offline installed-package smoke
        run: npm run test:pack
